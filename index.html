<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A beautifully designed, responsive stopwatch web application with Google authentication and pause history tracking." />
  <title>Stopwatch — Precision Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- Ambient background orbs -->
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-3" aria-hidden="true"></div>

  <main id="app">

    <!-- ===== Auth Bar ===== -->
    <div class="auth-bar" id="auth-bar">
      <!-- Signed-out state -->
      <div class="auth-signed-out" id="signed-out-view">
        <button class="btn-google" id="btn-sign-in" title="Sign in with Google">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span class="btn-sign-in-text">Sign in with Google</span>
        </button>
      </div>

      <!-- Signed-in state -->
      <div class="auth-signed-in" id="signed-in-view" style="display: none;">
        <div class="user-info" id="user-info">
          <img class="user-avatar" id="user-avatar" src="" alt="User avatar" style="display: none;" />
          <span class="user-name" id="user-name"></span>
        </div>
        <button class="btn-sign-out" id="btn-sign-out" title="Sign out">
          <svg class="sign-out-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>
    </div>

    <!-- ===== Stopwatch Card ===== -->
    <div class="stopwatch-card" id="stopwatch-card">
      <!-- Subtle glow ring behind the display -->
      <div class="glow-ring" id="glow-ring" aria-hidden="true"></div>

      <h1 class="title">Stopwatch</h1>

      <!-- Timer display -->
      <div class="timer-display" id="timer-display">
        <span class="time-segment" id="hours">00</span>
        <span class="time-colon">:</span>
        <span class="time-segment" id="minutes">00</span>
        <span class="time-colon">:</span>
        <span class="time-segment" id="seconds">00</span>
        <span class="time-dot">.</span>
        <span class="time-segment time-ms" id="milliseconds">00</span>
      </div>

      <!-- Progress ring -->
      <div class="progress-container" id="progress-container" aria-hidden="true">
        <svg class="progress-ring" viewBox="0 0 200 200">
          <circle class="progress-ring-bg" cx="100" cy="100" r="90" />
          <circle class="progress-ring-fill" id="progress-ring-fill" cx="100" cy="100" r="90" />
        </svg>
      </div>

      <!-- Controls -->
      <div class="controls" id="controls">
        <button class="btn btn-start" id="btn-start" title="Start timer">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span class="btn-label">Start</span>
        </button>
        <button class="btn btn-stop" id="btn-stop" title="Stop timer" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span class="btn-label">Stop</span>
        </button>
        <button class="btn btn-reset" id="btn-reset" title="Reset timer" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </div>

    <!-- ===== Timestamps Card ===== -->
    <div class="timestamps-card" id="timestamps-card" style="display: none;">
      <div class="timestamps-header">
        <div class="timestamps-title-group">
          <h2 class="timestamps-title">
            <svg class="timestamps-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Pause History
          </h2>
          <span class="timestamp-count-badge" id="timestamp-count" style="display: none;">0</span>
        </div>
        <button class="btn-clear" id="btn-clear-history" title="Clear all history">
          <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          Clear
        </button>
      </div>

      <div class="timestamps-table-wrapper">
        <table class="timestamps-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Elapsed Time</th>
              <th>Paused At</th>
            </tr>
          </thead>
          <tbody id="timestamps-tbody">
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div class="timestamps-empty" id="timestamps-empty" style="display: flex;">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>No pause history yet</p>
        <span>Press the Stop button while the timer is running to record a timestamp</span>
      </div>
    </div>

    <footer class="footer">
      <p>Built with precision &amp; passion</p>
    </footer>
  </main>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- App scripts (order matters: auth → timestamps → stopwatch) -->
  <script src="auth.js"></script>
  <script src="timestamps.js"></script>
  <script src="script.js"></script>
</body>
</html>
